# Project-wide Gradle settings.

# Aumenta la memoria del demonio de Gradle para builds mas rapidos
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Permite compilar modulos en paralelo
org.gradle.parallel=true

# Usa las librerias AndroidX (obligatorio: todas tus dependencias son AndroidX)
android.useAndroidX=true

# Migra automaticamente librerias antiguas de soporte a su equivalente AndroidX
android.enableJetifier=true

# Estilo de codigo por defecto para los recursos generados
android.nonTransitiveRClass=true
